name: Plugin Server Tests

on:
  workflow_run:
    workflows: ["Maven build"]
    types:
      - completed

  push:
    branches:
      - main
    paths:
      - ".github/workflows/server_tests.yml"

  workflow_dispatch:

jobs:
  test:
    name: Minecraft ${{ matrix.minecraft }} / Java ${{ matrix.java }}

    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.12.2"
            java: "8"

          - minecraft: "1.16.5"
            java: "8"

          - minecraft: "1.20.6"
            java: "17"

          - minecraft: "1.21.11"
            java: "25"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Test plugin
        uses: noone-075/plugin-server-test@main
        with:
          server: paper
          version: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          plugin: "target/*.jar"
          expected: "AutoRestart is enabled"
