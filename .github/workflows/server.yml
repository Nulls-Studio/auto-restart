name: Testing the plugin

on:
  workflow_run:
    workflows: [ "Java CI with Maven" ]
    types:
      - completed

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Download Paper 1.21.11
      run: |
        mkdir -p server/plugins

        curl -L \
          -H "User-Agent: AutoRestart-GitHub-Actions/1.0 (https://github.com/${{ github.repository }})" \
          "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds" \
          -o builds.json

        PAPER_URL=$(jq -r '
          first(
            .[]
            | select(.channel == "STABLE")
            | .downloads["server:default"].url
          )
        ' builds.json)

        if [ "$PAPER_URL" = "null" ] || [ -z "$PAPER_URL" ]; then
          echo "Could not find a stable Paper build for 1.21.11."
          cat builds.json
          exit 1
        fi

        echo "Downloading Paper from:"
        echo "$PAPER_URL"

        curl -L \
          -H "User-Agent: AutoRestart-GitHub-Actions/1.0 (https://github.com/${{ github.repository }})" \
          "$PAPER_URL" \
          -o server/paper.jar

        echo "eula=true" > server/eula.txt

    - name: Install AutoRestart
      run: |
        cp target/*.jar server/plugins/AutoRestart.jar

    - name: Start server
      run: |
        cd server

        java -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &

        echo $! > server.pid

    - name: Wait for server
      run: |
        echo "Waiting for Paper to start..."

        for i in {1..90}; do
          if grep -q "Done (" server/server.log; then
            echo "Paper started."
            exit 0
          fi

          sleep 2
        done

        echo "Paper failed to start."
        cat server/server.log
        exit 1

    - name: Check AutoRestart
      run: |
        if grep -q "[AutoRestart] AutoRestart is enabled and watching configured files." server/server.log; then
          echo "AutoRestart loaded successfully!"
          exit 0
        fi

        echo "AutoRestart failed to load!"
        echo "----- Server log -----"
        cat server/server.log
        exit 1

    - name: Stop server
      if: always()
      run: |
        if [ -f server/server.pid ]; then
          kill "$(cat server/server.pid)" || true
        fi
    - name: Show logs
      run: |
        cat server/server.log
