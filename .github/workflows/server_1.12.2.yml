name: Testing the plugin on 1.12.2

on:
  workflow_run:
    workflows: [ "Java CI with Maven" ]
    types:
      - completed

  push:
    branches:
      [ "main" ]
    paths:
      - ".github/workflows/server_1.12.2.yml"

  workflow_dispatch:

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Test AutoRestart
      uses: noone-075/plugin-server-test@main
      with:
        server: paper
        version: '1.12.2'
        java: '8'
        plugin: 'target/*.jar'
        expected: 'AutoRestart is enabled'

    - name: Show logs
      if: always()
      run: |
        if [ -f server/server.log ]; then
          cat server/server.log
        fi
