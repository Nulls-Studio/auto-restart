name: Testing the plugin on 1.12.2

on:
  workflow_run:
    workflows: [ "Java CI with Maven" ]
    types:
      - completed

  push:
    branches:
      [ "main" ]
    paths:
      - ".github/workflows/*"

  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Download Paper 1.12.2
      run: |
        mkdir -p server/plugins

        curl -L \
          "https://api.papermc.io/v2/projects/paper/versions/1.12.2/builds/1620/downloads/paper-1.12.2-1620.jar" \
          -o server/paper.jar

        echo "eula=true" > server/eula.txt

    - name: Install AutoRestart
      run: |
        cp target/*.jar server/plugins/AutoRestart.jar

    - name: Start server
      run: |
        cd server

        java -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &

        echo $! > server.pid

    - name: Wait for server
      run: |
        echo "Waiting for Paper to start..."

        for i in {1..90}; do
          if grep -q "Done (" server/server.log; then
            echo "Paper started."
            exit 0
          fi

          sleep 2
        done

        echo "Paper failed to start."
        cat server/server.log
        exit 1

    - name: Check AutoRestart
      run: |
        if grep -q "AutoRestart is enabled" server/server.log; then
          echo "AutoRestart loaded successfully!"
          exit 0
        fi

        echo "AutoRestart failed to load!"
        echo "----- Server log -----"
        cat server/server.log
        exit 1

    - name: Stop server
      if: always()
      run: |
        if [ -f server/server.pid ]; then
          kill "$(cat server/server.pid)" || true
        fi

    - name: Show logs
      run: |
        cat server/server.log
