name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "pom.xml"

  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "pom.xml"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml
